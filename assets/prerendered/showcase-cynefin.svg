<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="max-width: 880px; background-color: transparent;" viewBox="0 0 880 680" role="graphics-document document" aria-roledescription="cynefin"><style>#my-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:hsl(220.5882352941, 100%, 98.3333333333%);}#my-svg .error-text{fill:rgb(8.5000000002, 5.7500000001, 0);stroke:rgb(8.5000000002, 5.7500000001, 0);}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#0b0b0b;stroke:#0b0b0b;}#my-svg .marker.cross{stroke:#0b0b0b;}#my-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#my-svg p{margin:0;}#my-svg .cynefinDomain{stroke:none;}#my-svg .cynefinDomainLabel{font-size:16px;font-weight:bold;fill:#333;}#my-svg .cynefinSubtitle{font-size:11px;fill:#333;font-style:italic;}#my-svg .cynefinItem{fill-opacity:0.95;stroke:#0b0b0b;stroke-width:1;}#my-svg .cynefinItemText{font-size:12px;fill:#333;}#my-svg .cynefinItemOverflow{fill-opacity:0.6;stroke:#0b0b0b;stroke-width:1;stroke-dasharray:3 2;}#my-svg .cynefinBoundary{stroke:#0b0b0b;stroke-width:2;stroke-dasharray:6 3;}#my-svg .cynefinCliff{stroke:#8B0000;stroke-width:4;}#my-svg .cynefinConfusion{stroke:#0b0b0b;stroke-width:1.5;stroke-dasharray:4 2;}#my-svg .cyne