name: Bug report
description: Report a bug with Mermaid ELK Renderer
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.
        Please include enough detail so the issue can be reproduced.
        In plugin settings, use Support, Copy debug report and paste it below.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is happening, and what did you expect instead?
      placeholder: A short description of the bug and expected behavior.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a minimal Mermaid snippet if possible.
      placeholder: |
        1. Open note ...
        2. Add Mermaid block ...
        3. Enable or disable setting ...
        4. Observe error ...
    validations:
      required: true

  - type: textarea
    id: mermaid-snippet
    attributes:
      label: Mermaid snippet
      description: Paste the Mermaid diagram that triggers the issue.
      render: markdown

  - type: dropdown
    id: bundled-renderer
    attributes:
      label: Use bundled Mermaid 11 enabled?
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: true

  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04, etc.

  - type: textarea
    id: debug-report
    attributes:
      label: Debug report
      description: Paste the output from Support -> Copy debug report.
      render: text
    validations:
      required: true

  - type: textarea
    id: extra-logs
    attributes:
      label: Extra logs (optional)
      description: Add additional console logs only if they provide extra context beyond the debug report.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before creating this report.
          required: true
        - label: I can reproduce this with minimal steps.
          required: true
